<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haber Radarı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* Tek sütun, tarama panosu: üstte kazıyıcı durumu şeridi, altında üç sekme (ara / sor / alarmlar). */
    :root {
      --bg: #f3f5f7; --card: #ffffff; --ink: #172028; --muted: #5b6670; --line: #d9dee3;
      --accent: #0e7c86; --accent-ink: #ffffff; --alarm: #b42318; --warn: #9a6700; --ok: #1a7f4b; --mark: #ffe58a;
      --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #0f1418; --card: #161c22; --ink: #e6ebef; --muted: #9aa7b2; --line: #2a333c;
      --accent: #4fc1cc; --accent-ink: #0b1b1e; --alarm: #ff7a6e; --warn: #e3b341; --ok: #5ccf8a; --mark: #6b5a12; color-scheme: dark;
    } }
    :root[data-theme="dark"] {
      --bg: #0f1418; --card: #161c22; --ink: #e6ebef; --muted: #9aa7b2; --line: #2a333c;
      --accent: #4fc1cc; --accent-ink: #0b1b1e; --alarm: #ff7a6e; --warn: #e3b341; --ok: #5ccf8a; --mark: #6b5a12; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); padding-block: 0 48px; padding-inline: 16px; }
    a { color: var(--accent); }
    .wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 16px; }
    header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 20px 4px; }
    header.top h1 { font: 600 26px/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; }
    header.top nav { display: flex; gap: 14px; font-size: 14px; }
    header.top nav a { text-decoration: none; }
    header.top nav a:hover, header.top nav a:focus-visible { text-decoration: underline; }

    /* kazıyıcı durumu şeridi */
    .status { display: grid; gap: 6px; padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid var(--ok); background: var(--card); border-radius: 8px; font-size: 14px; }
    .status[data-level="warn"] { border-left-color: var(--warn); }
    .status[data-level="alarm"] { border-left-color: var(--alarm); }
    .status .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .status .row strong { color: var(--ink); font-weight: 500; }
    .status .msg { color: var(--ink); }
    .status details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
    .status ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
    .status ul li { margin: 2px 0; } .status ul a { color: var(--ink); text-decoration: none; } .status ul a:hover { text-decoration: underline; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
    .tabs button { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 14px; font: 500 15px var(--font-body); color: var(--muted); cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .panel[hidden] { display: none; }

    form.bar { display: grid; gap: 10px; }
    .field { display: grid; gap: 4px; min-width: 0; }
    label { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; min-width: 0; }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .main-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    button.primary { padding: 10px 18px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; cursor: pointer; font: 600 15px var(--font-body); }
    details.filters summary { cursor: pointer; font-size: 13px; color: var(--accent); list-style: none; }
    details.filters summary::before { content: "▸ "; } details.filters[open] summary::before { content: "▾ "; }
    .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
    .note { color: var(--muted); font-size: 14px; min-height: 1.4em; margin: 0; font-variant-numeric: tabular-nums; }

    .list { display: grid; gap: 10px; }
    article.item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
    article.item.alarm { border-left: 4px solid var(--alarm); }
    article.item h3 { margin: 0; font: 600 17px/1.3 var(--font-body); text-wrap: balance; }
    article.item h3 a { color: var(--ink); text-decoration: none; } article.item h3 a:hover { text-decoration: underline; }
    .meta { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; font: 13px var(--font-data); color: var(--muted); }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 500 12px var(--font-data); border: 1px solid var(--line); color: var(--muted); }
    .chip.score { color: var(--ok); border-color: var(--ok); } .chip.score.hot { color: var(--alarm); border-color: var(--alarm); }
    .chip.kw { color: var(--accent); border-color: var(--accent); } .chip.review { color: var(--warn); border-color: var(--warn); }
    .text { margin: 0; max-width: 70ch; } .text.sub { color: var(--muted); }
    mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
    .reason { margin: 2px 0 0; padding: 8px 12px; border-left: 3px solid var(--alarm); background: color-mix(in srgb, var(--alarm) 7%, transparent); border-radius: 6px; font-size: 14px; white-space: pre-wrap; max-width: 70ch; }
    .fb { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .fb button { padding: 4px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; cursor: pointer; font: 500 13px var(--font-body); }
    .fb button:hover { border-color: var(--accent); }
    .answer { white-space: pre-wrap; max-width: 70ch; margin: 0; }
    ol.timeline { margin: 0; padding-left: 20px; display: grid; gap: 4px; } .tdate { font: 12px var(--font-data); color: var(--muted); margin-right: 6px; }
    ol.sources { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; }
    h2.small { font: 500 13px var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
    @media (prefers-reduced-motion: no-preference) { button.primary, .fb button { transition: filter .15s; } button.primary:hover { filter: brightness(1.08); } }
    @media (max-width: 480px) { header.top h1 { font-size: 22px; } .main-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Haber Radarı</h1>
    <nav><a href="/">Pano</a><a href="/docs">API</a></nav>
  </header>

  <section class="status" id="status" data-level="ok" aria-live="polite">
    <div class="row" id="status-row"><span>Kazıyıcı durumu yükleniyor…</span></div>
    <div class="msg" id="status-msg" hidden></div>
    <details id="pending-box" hidden><summary id="pending-summary">Çekilemeyen haberler</summary><ul id="pending-list"></ul></details>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="search">Ara</button>
    <button role="tab" aria-selected="false" data-tab="ask">Soru sor</button>
    <button role="tab" aria-selected="false" data-tab="alarms">Alarmlar</button>
  </div>

  <section class="panel" id="panel-search">
    <form class="bar" id="search-form">
      <div class="main-row">
        <div class="field"><label for="q">Arama</label><input id="q" name="q" placeholder="fon soruşturması, Özgür Özel, bakan açıklaması…" autofocus></div>
        <button class="primary" type="submit">Ara</button>
      </div>
      <details class="filters"><summary>Filtreler</summary>
        <div class="filters-grid">
          <div class="field"><label for="source">Kaynak</label><select id="source"><option value="">Tümü</option><option value="hurriyet">Hürriyet</option><option value="12punto">12punto</option></select></div>
          <div class="field"><label for="since">Son N gün</label><input id="since" type="number" min="1" max="3660" value="{{ since_days }}"></div>
          <div class="field"><label for="only-alarms">Yalnızca alarm</label><select id="only-alarms"><option value="false">Hayır</option><option value="true">Evet</option></select></div>
        </div>
      </details>
    </form>
    <p class="note" id="search-note">En yeni haberler listeleniyor; bir terim yazıp arayın.</p>
    <div class="list" id="results"></div>
  </section>

  <section class="panel" id="panel-ask" hidden>
    <form class="bar" id="ask-form">
      <div class="main-row">
        <div class="field"><label for="question">Soru</label><input id="question" placeholder="Özgür Özel ile Kemal Kılıçdaroğlu arasındaki son durum ne?" minlength="2" required></div>
        <button class="primary" type="submit" id="ask-btn">Sor</button>
      </div>
      <details class="filters"><summary>Filtreler</summary>
        <div class="filters-grid"><div class="field"><label for="ask-days">Son N gün</label><input id="ask-days" type="number" min="1" max="3660" value="{{ since_days }}"></div></div>
      </details>
    </form>
    <p class="note" id="ask-note">Cevap, depodaki en yeni haberlere dayanır ve kaynak numaralarıyla gelir.</p>
    <div class="list" id="ask-result"></div>
  </section>

  <section class="panel" id="panel-alarms" hidden>
    <form class="bar" id="alarm-form">
      <div class="filters-grid">
        <div class="field"><label for="alarm-hours">Son N saat</label><input id="alarm-hours" type="number" min="1" max="8760" value="48"></div>
        <div class="field"><label for="alarm-dups">Tekrarlar</label><select id="alarm-dups"><option value="false">Gizle</option><option value="true">Göster</option></select></div>
        <div class="field"><label>&nbsp;</label><button class="primary" type="submit">Listele</button></div>
      </div>
    </form>
    <p class="note" id="alarm-note"></p>
    <div class="list" id="alarms"></div>
  </section>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtDate = (iso) => { if (!iso) return "-"; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  const fmtTime = (iso) => { if (!iso) return "-"; const d = new Date(iso); return isNaN(d) ? "-" : d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }); };
  const ago = (sec) => sec == null ? "-" : sec < 90 ? `${sec} sn önce` : sec < 5400 ? `${Math.round(sec / 60)} dk önce` : `${Math.round(sec / 3600)} sa önce`;
  const highlight = (text, q) => {
    let out = esc(text || "");
    (q || "").split(/\s+/).filter((w) => w.length > 2).forEach((w) => {
      out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\w*)", "giu"), "<mark>$1</mark>");
    });
    return out;
  };

  /* sekmeler */
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    document.querySelectorAll(".panel").forEach((p) => { p.hidden = p.id !== "panel-" + b.dataset.tab; });
    if (b.dataset.tab === "alarms" && !$("alarms").dataset.loaded) loadAlarms();
  }));

  /* kazıyıcı durumu */
  async function loadStatus() {
    try {
      const r = await fetch("/scraper/status");
      const s = await r.json();
      const last = s.last_run;
      const row = [];
      row.push(`<span>Son tarama <strong>${last ? ago(s.last_run_age_seconds) : "yok"}</strong></span>`);
      if (last) row.push(`<span>yeni <strong>${esc(last.published)}</strong> · hata <strong>${esc(last.errors)}</strong></span>`);
      row.push(`<span>Sonraki <strong>${s.next_run_at ? fmtTime(s.next_run_at) : "-"}</strong> (her ${Math.round((s.interval_seconds || 0) / 60)} dk)</span>`);
      row.push(`<span>Bekleyen <strong>${esc(s.pending_count)}</strong></span>`);
      $("status-row").innerHTML = row.join("");
      const level = s.stale ? "alarm" : (s.pending_count ? "warn" : "ok");
      $("status").dataset.level = level;
      $("status-msg").hidden = !s.warning;
      $("status-msg").textContent = s.warning || "";
      const box = $("pending-box");
      box.hidden = !(s.pending && s.pending.length);
      if (!box.hidden) {
        $("pending-summary").textContent = `Çekilemeyen ${s.pending_count} haber (sonraki turda yeniden denenir)`;
        $("pending-list").innerHTML = s.pending.map((p) => `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title || p.url)}</a> <span class="tdate">${esc(p.source)} · ${esc(p.reason)} · ${p.attempts} deneme</span></li>`).join("");
      }
    } catch (e) {
      $("status").dataset.level = "warn";
      $("status-row").innerHTML = `<span>Kazıyıcı durumu okunamadı: ${esc(e.message)}</span>`;
    }
  }

  /* arama */
  function chipScore(doc) { const s = Number(doc.alarm_score || 0); return `<span class="chip score${doc.is_alarm ? " hot" : ""}">${doc.is_alarm ? "ALARM " : "skor "}${s}</span>`; }
  function renderArticle(doc, q) {
    const kws = (doc.matched_keywords || []).map((k) => `<span class="chip kw">${esc(k)}</span>`).join("");
    const sub = (doc.subtitle || "").trim();
    let body = (doc.snippet || doc.llm_summary || "").trim();
    const same = (a, b) => a && b && (a.slice(0, 60) === b.slice(0, 60));
    if (same(body, sub)) body = doc.llm_summary && !same(doc.llm_summary, sub) ? doc.llm_summary : "";
    return `<article class="item${doc.is_alarm ? " alarm" : ""}">
      <h3><a href="${esc(doc.content_url)}" target="_blank" rel="noopener">${esc(doc.title)}</a></h3>
      <div class="meta"><span>${esc(doc.source)}</span><span>${fmtDate(doc.published_at)}</span>${chipScore(doc)}${kws}${doc.needs_review ? '<span class="chip review">inceleme</span>' : ""}</div>
      ${doc.subtitle ? `<p class="text sub">${highlight(doc.subtitle, q)}</p>` : ""}
      ${body ? `<p class="text">${highlight(body, q)}</p>` : ""}
      ${doc.is_alarm && doc.alarm_reason ? `<div class="reason">${esc(doc.alarm_reason)}</div>` : ""}
    </article>`;
  }
  async function search(ev) {
    if (ev) ev.preventDefault();
    const q = $("q").value.trim();
    const p = new URLSearchParams({ q, size: 30, only_alarms: $("only-alarms").value });
    if ($("source").value) p.set("sources", $("source").value);
    if ($("since").value) p.set("since_days", $("since").value);
    $("search-note").textContent = "Aranıyor…";
    try {
      const r = await fetch("/articles/search?" + p.toString());
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const items = (await r.json()).results || [];
      $("search-note").textContent = q ? `${items.length} sonuç · "${q}"` : `${items.length} en yeni haber`;
      $("results").innerHTML = items.length ? items.map((d) => renderArticle(d, q)).join("") : `<p class="empty">Sonuç yok. Terimi kısaltmayı ya da süreyi genişletmeyi deneyin.</p>`;
    } catch (e) { $("search-note").textContent = "Arama yapılamadı: " + e.message; }
  }
  $("search-form").addEventListener("submit", search);

  /* soru */
  async function ask(ev) {
    ev.preventDefault();
    const question = $("question").value.trim();
    if (!question) return;
    $("ask-btn").disabled = true; $("ask-note").textContent = "Yanıt üretiliyor, model birkaç saniye alabilir…"; $("ask-result").innerHTML = "";
    try {
      const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, since_days: Number($("ask-days").value) || undefined }) });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const a = await r.json();
      $("ask-note").textContent = `${a.retrieved_count} haber · model ${a.model} · terimler: ${(a.search_terms || []).join(", ") || "-"}`;
      const timeline = (a.timeline || []).map((t) => `<li><span class="tdate">${fmtDate(t.date)}</span>${t.citation ? `[${t.citation}] ` : ""}${esc(t.event)}</li>`).join("");
      const sources = (a.sources || []).map((c, i) => `<li>[${i + 1}] <a href="${esc(c.content_url)}" target="_blank" rel="noopener">${esc(c.title)}</a> <span class="tdate">${esc(c.source)} · ${fmtDate(c.published_at)}</span></li>`).join("");
      $("ask-result").innerHTML = `<article class="item"><p class="answer">${esc(a.answer)}</p></article>` +
        (timeline ? `<article class="item"><h2 class="small">Zaman çizelgesi · eski → yeni</h2><ol class="timeline">${timeline}</ol></article>` : "") +
        (sources ? `<article class="item"><h2 class="small">Kaynaklar</h2><ol class="sources">${sources}</ol></article>` : "");
    } catch (e) { $("ask-note").textContent = "Soru yanıtlanamadı: " + e.message; }
    finally { $("ask-btn").disabled = false; }
  }
  $("ask-form").addEventListener("submit", ask);

  /* alarmlar + geri bildirim */
  async function feedback(alarmId, label, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(`/alarms/${encodeURIComponent(alarmId)}/feedback`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ label, user: "arayüz" }) });
      btn.textContent = r.ok ? "Kaydedildi" : "Kaydedilemedi";
    } catch (e) { btn.textContent = "Kaydedilemedi"; }
  }
  function renderAlarm(a) {
    const kws = (a.matched_keywords || []).map((k) => `<span class="chip kw">${esc(k)}</span>`).join("");
    return `<article class="item alarm">
      <h3><a href="${esc(a.content_url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3>
      <div class="meta"><span>${esc(a.source)}</span><span>${fmtDate(a.published_at)}</span><span class="chip score hot">ALARM ${esc(a.alarm_score)}</span>${kws}${a.needs_review ? '<span class="chip review">inceleme</span>' : ""}${a.duplicate_of ? `<span class="chip">tekrar</span>` : ""}</div>
      ${a.alarm_reason ? `<div class="reason">${esc(a.alarm_reason)}</div>` : ""}
      <div class="fb"><span>Bu alarm doğru mu?</span>
        <button data-id="${esc(a.alarm_id)}" data-label="true_positive">Doğru</button>
        <button data-id="${esc(a.alarm_id)}" data-label="false_positive">Yanlış</button>
        <button data-id="${esc(a.alarm_id)}" data-label="needs_context">Belirsiz</button></div>
    </article>`;
  }
  async function loadAlarms(ev) {
    if (ev) ev.preventDefault();
    const p = new URLSearchParams({ since_hours: $("alarm-hours").value || 48, size: 100, include_duplicates: $("alarm-dups").value });
    $("alarm-note").textContent = "Yükleniyor…";
    try {
      const r = await fetch("/alarms?" + p.toString());
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const data = await r.json();
      $("alarm-note").textContent = `${data.count} alarm`;
      $("alarms").innerHTML = data.items.length ? data.items.map(renderAlarm).join("") : `<p class="empty">Bu aralıkta alarm yok.</p>`;
      $("alarms").dataset.loaded = "1";
      $("alarms").querySelectorAll(".fb button").forEach((b) => b.addEventListener("click", () => feedback(b.dataset.id, b.dataset.label, b)));
    } catch (e) { $("alarm-note").textContent = "Alarmlar yüklenemedi: " + e.message; }
  }
  $("alarm-form").addEventListener("submit", loadAlarms);

  loadStatus(); search();
  setInterval(loadStatus, 60000);
})();
</script>
</body>
</html>
